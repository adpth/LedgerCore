name: API docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - name: Generate Swagger UI and OpenAPI schema
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          from fastapi.openapi.docs import get_swagger_ui_html

          from ledger.api import app

          site = Path('_site')
          site.mkdir(exist_ok=True)
          schema = app.openapi()
          assert schema['paths'], 'OpenAPI schema has no routes'
          (site / 'openapi.json').write_text(json.dumps(schema, indent=2), encoding='utf-8')
          page = get_swagger_ui_html(
              openapi_url='./openapi.json',
              title=f'{app.title} API reference',
              swagger_ui_parameters={'supportedSubmitMethods': []},
          )
          (site / 'index.html').write_bytes(page.body)
          PY
      - name: Copy the LedgerCore demo
        run: |
          mkdir -p _site/demo
          cp docs/demo/index.html docs/demo/poster.jpg docs/demo/ledgercore.mp4 _site/demo/
      - name: Export browser captions from the demo
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -v error -i _site/demo/ledgercore.mp4 -map 0:s:0 -c:s webvtt _site/demo/captions.vtt
      - uses: actions/configure-pages@v5
      - name: Name the Pages artifact for this build attempt
        id: pages-artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}

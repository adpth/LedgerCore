[project]
name = "ledgercore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1", "confluent-kafka>=2.8,<3", "httpx>=0.28,<1",
  "opentelemetry-distro>=0.57b0,<1", "opentelemetry-exporter-otlp>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "testcontainers[postgres]>=4,<5", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[project]
name = "ledgercore"
version = "0.1.0"
authors = [
    { name = "Tharun", email = "adpth14@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ledgercore-drift-check = "ledgercore.cli:main"
ledgercore-outbox-relay = "ledgercore.outbox.relay:main"
ledgercore-payout-recovery = "ledgercore.services.payout_recovery:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "hypothesis>=6.169.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests that need a real Postgres (Testcontainers)"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

groups:
  - name: ledgercore
    rules:
      - alert: LedgerBalanceDrift
        expr: max(ledger_reconciliation_mismatches) > 0
        annotations:
          summary: Ledger projection differs from journal lines
      - alert: LedgerReconciliationMissing
        expr: absent_over_time(ledger_reconciliation_mismatches[5m])
        for: 5m
        annotations:
          summary: Reconciliation series missing from the collector
      - alert: LedgerOutboxBacklog
        expr: max(ledger_outbox_oldest_pending_seconds) > 60
        for: 5m
        annotations:
          summary: Ledger events have been queued for over one minute
